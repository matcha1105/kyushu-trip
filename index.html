<style>
:root{color-scheme:light; --paper:#FFFCF6; --ink:#3E3A39; --soft:#6E6866; --coral:#F2A497; --yama:#F6D27A; --mizu:#A8D3E6; --take:#B9DAA5; --coral-t:#FBE3DE; --mizu-t:#E3F1F7}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--paper); color:var(--ink); font-family:"Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; line-height:1.6;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
.hidden{display:none !important}
.wrap{min-height:100%; display:flex; align-items:center; justify-content:center; padding-inline:16px; padding-block:24px}
.card{width:100%; max-width:380px; background:var(--paper); border:3px solid var(--ink); border-radius:26px; box-shadow:4px 4px 0 var(--ink); overflow:hidden}
.art{display:block; width:100%; height:auto; background:var(--mizu-t); border-bottom:3px solid var(--ink)}
.body{padding:18px 20px 22px}
h1{margin:0; font-weight:400; font-size:1.8rem; line-height:1.2; letter-spacing:.04em}
.lead{margin:6px 0 16px; color:var(--soft)}
.field{display:flex; align-items:center; border:3px solid var(--ink); border-radius:16px; background:var(--paper); overflow:hidden}
.field:focus-within{box-shadow:0 0 0 3px var(--yama)}
.field input{flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:1.1rem; letter-spacing:.08em; padding:12px 14px; color:var(--ink)}
.toggle{flex:none; border:0; border-left:3px solid var(--ink); background:var(--mizu); font:inherit; font-size:.9rem; padding:0 14px; align-self:stretch; cursor:pointer; color:var(--ink)}
.remember{display:flex; align-items:center; gap:10px; margin:14px 0 0; cursor:pointer}
.remember input{appearance:none; -webkit-appearance:none; margin:0; width:24px; height:24px; border:3px solid var(--ink); border-radius:8px; background:var(--paper); display:grid; place-content:center; cursor:pointer}
.remember input::after{content:""; width:11px; height:6px; border-left:3px solid var(--ink); border-bottom:3px solid var(--ink); transform:rotate(-45deg) translate(1px,-1px) scale(0)}
.remember input:checked{background:var(--take)}
.remember input:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.go{margin-top:16px; width:100%; border:3px solid var(--ink); border-radius:999px; background:var(--coral); font:inherit; font-size:1.1rem; padding:10px; cursor:pointer; color:var(--ink); box-shadow:3px 3px 0 var(--ink)}
.go:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
:focus-visible{outline:3px dashed var(--coral); outline-offset:3px}
.err{margin:12px 0 0; padding:8px 12px; border:2px dashed var(--ink); border-radius:12px; background:var(--coral-t)}
.err.shake{animation:shake .4s ease}
.loading{min-height:100%; display:flex; align-items:center; justify-content:center}
.loading svg{width:72px; height:72px; animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}}
@keyframes drift{from{transform:translateX(0)} to{transform:translateX(18px)}}
@keyframes rock{0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)}}
@keyframes shake{0%,100%{transform:none} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}}
.a-cloud{animation:drift 8s ease-in-out infinite alternate}
.a-boat{transform-box:fill-box; transform-origin:50% 90%; animation:rock 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important; transition:none !important}}
</style>
</head>
